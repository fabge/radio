name: record barakan beat

on:
  schedule:
    # Every Sunday at 13:05 UTC (22:05 JST)
    - cron: '5 13 * * 0'
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # recording + speech segmentation (~8 min for a 2h show) + buffer
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils ffmpeg wireguard

      - name: Set up Mullvad VPN
        id: vpn
        run: |
          # Create WireGuard config from secret
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.MULLVAD_WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          # Start WireGuard
          sudo wg-quick up wg0

          # Wait for a handshake before trusting the tunnel. wg-quick brings the
          # interface up regardless, so an inactive Mullvad subscription or a
          # retired device key looks identical to a working setup until a peer
          # actually answers.
          HANDSHAKE=
          for _ in $(seq 30); do
            LATEST=$(sudo wg show wg0 latest-handshakes 2>/dev/null | awk '{print $2}' | sort -rn | head -1) || true
            if [ -n "$LATEST" ] && [ "$LATEST" != "0" ]; then
              HANDSHAKE=yes
              break
            fi
            sleep 1
          done
          sudo wg show wg0 || true

          # No handshake means there is nothing to record through. Skip the run
          # cleanly instead of failing every Sunday until the VPN is back.
          if [ -z "$HANDSHAKE" ]; then
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No WireGuard handshake after 30s - the Mullvad subscription or device key is inactive. Skipping this week's recording; it resumes automatically once the VPN works again."
            exit 0
          fi

          # The tunnel is confirmed working, so anything below is a real fault.
          IP_INFO=$(curl -sf --max-time 30 https://ipinfo.io/json) || {
            echo "Error: tunnel is up but https://ipinfo.io/json is unreachable, so the exit country cannot be confirmed."
            exit 1
          }
          echo "$IP_INFO"
          COUNTRY=$(echo "$IP_INFO" | jq -r '.country')
          if [ "$COUNTRY" != "JP" ]; then
            echo "Error: VPN not connected to Japan (got: $COUNTRY). Radiko requires a Japanese IP."
            exit 1
          fi
          echo "connected=true" >> "$GITHUB_OUTPUT"
          echo "VPN connected to Japan successfully"

      - name: Calculate recording date (JST)
        id: date
        if: steps.vpn.outputs.connected == 'true'
        run: |
          # Use 6 hours ago in JST to handle GitHub Actions queue delays past midnight
          JST_DATE_DDMMYYYY=$(TZ=Asia/Tokyo date -d '6 hours ago' +%d.%m.%Y)
          JST_DATE_YYYYMMDD=$(TZ=Asia/Tokyo date -d '6 hours ago' +%Y%m%d)
          echo "date_ddmmyyyy=$JST_DATE_DDMMYYYY" >> $GITHUB_OUTPUT
          echo "date_yyyymmdd=$JST_DATE_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "Recording date (JST): $JST_DATE_DDMMYYYY"

      - name: Record Barakan Beat
        if: steps.vpn.outputs.connected == 'true'
        run: |
          DATE_YYYYMMDD="${{ steps.date.outputs.date_yyyymmdd }}"
          DATE_DDMMYYYY="${{ steps.date.outputs.date_ddmmyyyy }}"
          START_TIME="${DATE_YYYYMMDD}1800"
          OUTPUT_FILE="audio/${DATE_DDMMYYYY}.m4a"

          ./rec_radiko_ts.sh \
            -s INT \
            -f "$START_TIME" \
            -d 120 \
            -o "$OUTPUT_FILE"

      - name: Disconnect VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Generate music-only version
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          pip install "inaSpeechSegmenter>=0.8.0"
          python strip_speech.py \
            "audio/${{ steps.date.outputs.date_ddmmyyyy }}.m4a" \
            "audio/music/${{ steps.date.outputs.date_ddmmyyyy }}.m4a"

      - name: Update README with cog
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          pip install cogapp
          cog -r README.md

      - name: Commit and push if new file
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add audio README.md
          git diff --staged --quiet || (git commit -m "Record Barakan Beat for ${{ steps.date.outputs.date_ddmmyyyy }}" && git push)

      - name: Cleanup old recordings (keep last 5)
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          FILE_COUNT=$(ls -1 audio/*.m4a 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -le 5 ]; then
            echo "Only $FILE_COUNT recordings, no cleanup needed"
            exit 0
          fi

          # Get oldest files to remove (both originals and music-only versions)
          FILES_TO_REMOVE=$(ls -1t audio/*.m4a | tail -n +6; ls -1t audio/music/*.m4a 2>/dev/null | tail -n +6)
          echo "Removing old recordings from history:"
          echo "$FILES_TO_REMOVE"

          pip install git-filter-repo

          # Remove each old file from history
          for file in $FILES_TO_REMOVE; do
            git-filter-repo --path "$file" --invert-paths --force
          done

          # Re-add remote and force push
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin main
