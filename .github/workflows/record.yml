name: record barakan beat

on:
  schedule:
    # Every Sunday at 13:05 UTC (22:05 JST)
    - cron: '5 13 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'Broadcast date to record (YYYY-MM-DD, JST). Defaults to the latest Sunday show.'
        required: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # recording + speech segmentation (~8 min for a 2h show) + buffer
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils ffmpeg wireguard

      - name: Set up Mullvad VPN
        id: vpn
        run: |
          # The subscription is not kept permanently, so an expired account is
          # the one expected outage: skip the run cleanly. Checked before the
          # tunnel is up, which would otherwise route this request into it.
          TOKEN=$(curl -sf --max-time 30 -X POST https://api.mullvad.net/auth/v1/token \
            -H 'content-type: application/json' \
            -d '{"account_number":"${{ secrets.MULLVAD_ACCOUNT }}"}' | jq -er .access_token)
          echo "::add-mask::$TOKEN"
          EXPIRY=$(curl -sf --max-time 30 https://api.mullvad.net/accounts/v1/accounts/me \
            -H "Authorization: Bearer $TOKEN" | jq -er .expiry)
          if [ "$(date -d "$EXPIRY" +%s)" -le "$(date +%s)" ]; then
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Mullvad subscription expired on $EXPIRY. Skipping this week's recording; it resumes automatically once the subscription is renewed."
            exit 0
          fi
          echo "Mullvad subscription active until $EXPIRY"

          # Create WireGuard config from secret
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.MULLVAD_WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          # Start WireGuard
          sudo wg-quick up wg0

          # wg-quick brings the interface up regardless of whether the peer
          # answers, so wait for a handshake before trusting the tunnel.
          HANDSHAKE=
          for _ in $(seq 30); do
            LATEST=$(sudo wg show wg0 latest-handshakes 2>/dev/null | awk '{print $2}' | sort -rn | head -1) || true
            if [ -n "$LATEST" ] && [ "$LATEST" != "0" ]; then
              HANDSHAKE=yes
              break
            fi
            sleep 1
          done
          sudo wg show wg0 || true

          if [ -z "$HANDSHAKE" ]; then
            echo "Error: no WireGuard handshake after 30s although the subscription is active. Check that the config's server is still in https://mullvad.net/en/servers and its device key is still registered on the account."
            exit 1
          fi

          # The tunnel is confirmed working, so anything below is a real fault.
          IP_INFO=$(curl -sf --max-time 30 https://ipinfo.io/json) || {
            echo "Error: tunnel is up but https://ipinfo.io/json is unreachable, so the exit country cannot be confirmed."
            exit 1
          }
          echo "$IP_INFO"
          COUNTRY=$(echo "$IP_INFO" | jq -r '.country')
          if [ "$COUNTRY" != "JP" ]; then
            echo "Error: VPN not connected to Japan (got: $COUNTRY). Radiko requires a Japanese IP."
            exit 1
          fi
          echo "connected=true" >> "$GITHUB_OUTPUT"
          echo "VPN connected to Japan successfully"

      - name: Calculate recording date (JST)
        id: date
        if: steps.vpn.outputs.connected == 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          # Use 6 hours ago in JST to handle GitHub Actions queue delays past midnight
          DATE=${INPUT_DATE:-6 hours ago}
          JST_DATE_DDMMYYYY=$(TZ=Asia/Tokyo date -d "$DATE" +%d.%m.%Y)
          JST_DATE_YYYYMMDD=$(TZ=Asia/Tokyo date -d "$DATE" +%Y%m%d)
          echo "date_ddmmyyyy=$JST_DATE_DDMMYYYY" >> $GITHUB_OUTPUT
          echo "date_yyyymmdd=$JST_DATE_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "Recording date (JST): $JST_DATE_DDMMYYYY"

      - name: Record Barakan Beat
        if: steps.vpn.outputs.connected == 'true'
        run: |
          DATE_YYYYMMDD="${{ steps.date.outputs.date_yyyymmdd }}"
          DATE_DDMMYYYY="${{ steps.date.outputs.date_ddmmyyyy }}"
          START_TIME="${DATE_YYYYMMDD}1800"
          OUTPUT_FILE="audio/${DATE_DDMMYYYY}.m4a"

          ./rec_radiko_ts.sh \
            -s INT \
            -f "$START_TIME" \
            -d 120 \
            -o "$OUTPUT_FILE"

      - name: Disconnect VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Generate music-only version
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          pip install "inaSpeechSegmenter>=0.8.0"
          python strip_speech.py \
            "audio/${{ steps.date.outputs.date_ddmmyyyy }}.m4a" \
            "audio/music/${{ steps.date.outputs.date_ddmmyyyy }}.m4a"

      - name: Update README with cog
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          pip install cogapp
          cog -r README.md

      - name: Commit and push if new file
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add audio README.md
          git diff --staged --quiet || (git commit -m "Record Barakan Beat for ${{ steps.date.outputs.date_ddmmyyyy }}" && git push)

      - name: Cleanup old recordings (keep last 5)
        if: success() && steps.vpn.outputs.connected == 'true'
        run: |
          # Order by the date in the DD.MM.YYYY filename; file mtimes are all
          # equal after checkout.
          OLD=$(ls audio/*.m4a | xargs -n1 basename | awk -F. '{print $3 $2 $1, $0}' | sort -r | tail -n +6 | cut -d' ' -f2)
          if [ -z "$OLD" ]; then
            echo "5 or fewer recordings, no cleanup needed"
            exit 0
          fi
          echo "Removing old recordings from history:"
          echo "$OLD"

          pip install git-filter-repo

          PATHS=()
          for f in $OLD; do
            PATHS+=(--path "audio/$f" --path "audio/music/$f")
          done
          git-filter-repo "${PATHS[@]}" --invert-paths --force

          # Re-add remote and force push
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin main
