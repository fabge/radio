name: record barakan beat

on:
  schedule:
    # Every Sunday at 13:05 UTC (22:05 JST)
    - cron: '5 13 * * 0'
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 120 min recording + 30 min buffer for setup/processing
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libxml2-utils ffmpeg wireguard jq

      - name: Set up Mullvad VPN
        run: |
          # Create WireGuard config from secret
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.MULLVAD_WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          # Start WireGuard
          sudo wg-quick up wg0
          # Verify connection - must be from Japan for Radiko to work
          sleep 3
          IP_INFO=$(curl -sf https://ipinfo.io/json) || { echo "Failed to check IP"; exit 1; }
          echo "$IP_INFO"
          COUNTRY=$(echo "$IP_INFO" | jq -r '.country')
          if [ "$COUNTRY" != "JP" ]; then
            echo "Error: VPN not connected to Japan (got: $COUNTRY). Radiko requires a Japanese IP."
            exit 1
          fi
          echo "VPN connected to Japan successfully"

      - name: Calculate recording date (JST)
        id: date
        run: |
          # Get current date in JST (UTC+9) in format DD.MM.YYYY
          JST_DATE_DDMMYYYY=$(TZ=Asia/Tokyo date +%d.%m.%Y)
          JST_DATE_YYYYMMDD=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "date_ddmmyyyy=$JST_DATE_DDMMYYYY" >> $GITHUB_OUTPUT
          echo "date_yyyymmdd=$JST_DATE_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "Recording date (JST): $JST_DATE_DDMMYYYY"

      - name: Record Barakan Beat
        run: |
          DATE_YYYYMMDD="${{ steps.date.outputs.date_yyyymmdd }}"
          DATE_DDMMYYYY="${{ steps.date.outputs.date_ddmmyyyy }}"
          START_TIME="${DATE_YYYYMMDD}1800"
          OUTPUT_FILE="audio/${DATE_DDMMYYYY}.m4a"

          ./rec_radiko_ts.sh \
            -s INT \
            -f "$START_TIME" \
            -d 120 \
            -o "$OUTPUT_FILE"

      - name: Disconnect VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Update README with cog
        if: success()
        run: cog -r README.md

      - name: Commit and push if new file
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add audio/*.m4a README.md
          git diff --staged --quiet || (git commit -m "Record Barakan Beat for ${{ steps.date.outputs.date_ddmmyyyy }}" && git push)
